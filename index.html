<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2D World Project</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #222222; /* 배경색 */
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="world"></canvas>

  <script>
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d');

    // 화면 크기 재설정
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 1. 더미 (허수아비)
    const dummy = {
      x: canvas.width / 2 + 150,
      y: canvas.height / 2,
      bodyWidth: 20,
      bodyHeight: 30,
      headWidth: 16,
      headHeight: 16,
      bodyColor: '#FFFFE0', // 아이보리색
      headColor: '#2F4F4F'  // 살짝 어두운 초록색
    };

    // 2. 플레이어 (핑크색 원)
    const player = {
      x: canvas.width / 2 - 150,
      y: canvas.height / 2,
      targetX: canvas.width / 2 - 150,
      targetY: canvas.height / 2,
      radius: 15,
      color: '#FF69B4', // 핑크색
      speed: 5
    };

    // 마우스 클릭 시 목표 지점 갱신 (이동 중 클릭해도 새로운 위치로 즉시 재지정)
    window.addEventListener('click', (e) => {
      player.targetX = e.clientX;
      player.targetY = e.clientY;
    });

    // 프레임 업데이트 Logic
    function update() {
      const dx = player.targetX - player.x;
      const dy = player.targetY - player.y;
      const distance = Math.hypot(dx, dy);

      // 목표 지점과의 거리가 속도보다 크면 계속 이동
      if (distance > player.speed) {
        player.x += (dx / distance) * player.speed;
        player.y += (dy / distance) * player.speed;
      } else {
        // 목표 근처에 도착하면 정지
        player.x = player.targetX;
        player.y = player.targetY;
      }
    }

    // 화면 그리기
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 더미 그리기
      // 몸통 (아이보리 사각형)
      ctx.fillStyle = dummy.bodyColor;
      ctx.fillRect(dummy.x - dummy.bodyWidth / 2, dummy.y, dummy.bodyWidth, dummy.bodyHeight);
      // 머리 (어두운 초록 사각형)
      ctx.fillStyle = dummy.headColor;
      ctx.fillRect(dummy.x - dummy.headWidth / 2, dummy.y - dummy.headHeight, dummy.headWidth, dummy.headHeight);

      // 플레이어 그리기 (핑크색 원)
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fillStyle = player.color;
      ctx.fill();
      ctx.closePath();
    }

    // 메인 메인 루프
    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
