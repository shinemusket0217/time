<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2D World Project</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #222222;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="world"></canvas>

  <script>
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let mouseX = canvas.width / 2;
    let mouseY = canvas.height / 2;
    let isMouseDown = false;

    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      if (isMouseDown) {
        player.targetX = mouseX;
        player.targetY = mouseY;
      }
    });

    window.addEventListener('mousedown', (e) => {
      isMouseDown = true;
      player.targetX = e.clientX;
      player.targetY = e.clientY;
    });

    window.addEventListener('mouseup', () => {
      isMouseDown = false;
    });

    // 1. 더미 (허수아비)
    const dummy = {
      x: canvas.width / 2 + 150,
      y: canvas.height / 2,
      bodyWidth: 20,
      bodyHeight: 30,
      headWidth: 20,
      headHeight: 16,
      bodyColor: '#FFFFE0',
      headColor: '#558B2F'
    };

    // 2. 플레이어 (핑크색 원)
    const player = {
      x: canvas.width / 2 - 150,
      y: canvas.height / 2,
      targetX: canvas.width / 2 - 150,
      targetY: canvas.height / 2,
      radius: 15,
      color: '#FF69B4',
      speed: 10 / 3,

      // W 돌진 시스템 (속도 30% 감속: 15 -> 10.5)
      isCharging: false,
      isDashing: false,
      dashSpeed: 10.5,
      dashDuration: 6,
      dashTimeLeft: 0,
      dashDirX: 0,
      dashDirY: 0,

      // Q 스킬 시스템 (포물선 도약)
      isQCharging: false,
      isQJumping: false,
      qRange: 140,            // 돌진 거리(63px)보다 넓은 범위
      qDuration: 18,         // 점프 시간 (프레임)
      qTimeLeft: 0,
      qStartX: 0,
      qStartY: 0,
      qTargetX: 0,
      qTargetY: 0,
      qArcMax: 30,           // 포물선 피크 높이 (과하지 않은 굴곡)

      // 쿨타임 시스템
      cooldownTime: 13000,
      lastDashTime: 0
    };

    // 더미 위 마우스 호버 여부 확인
    function isMouseOverDummy() {
      const box = {
        minX: dummy.x - dummy.bodyWidth / 2 - 8,
        maxX: dummy.x + dummy.bodyWidth / 2 + 8,
        minY: dummy.y - dummy.headHeight - 8,
        maxY: dummy.y + dummy.bodyHeight + 8
      };
      return mouseX >= box.minX && mouseX <= box.maxX && mouseY >= box.minY && mouseY <= box.maxY;
    }

    // 더미가 Q 사거리 내에 있는지 확인
    function isDummyInQRange() {
      const dist = Math.hypot(dummy.x - player.x, dummy.y - player.y);
      return dist <= player.qRange;
    }

    // 키보드 입력 처리
    window.addEventListener('keydown', (e) => {
      if ((e.key === 'w' || e.key === 'W') && !e.repeat) {
        player.isCharging = true;
      }
      if ((e.key === 'q' || e.key === 'Q') && !e.repeat) {
        player.isQCharging = true;
      }
    });

    window.addEventListener('keyup', (e) => {
      // W 돌진 실행
      if (e.key === 'w' || e.key === 'W') {
        const now = Date.now();
        const timePassed = now - player.lastDashTime;

        if (player.isCharging && timePassed >= player.cooldownTime && !player.isDashing && !player.isQJumping) {
          const dx = mouseX - player.x;
          const dy = mouseY - player.y;
          const distance = Math.hypot(dx, dy);

          if (distance > 0) {
            player.isDashing = true;
            player.dashTimeLeft = player.dashDuration;
            player.dashDirX = dx / distance;
            player.dashDirY = dy / distance;
            player.lastDashTime = now;
          }
        }
        player.isCharging = false;
      }

      // Q 도약 실행
      if (e.key === 'q' || e.key === 'Q') {
        if (player.isQCharging && isMouseOverDummy() && isDummyInQRange() && !player.isDashing && !player.isQJumping) {
          player.isQJumping = true;
          player.qTimeLeft = player.qDuration;
          player.qStartX = player.x;
          player.qStartY = player.y;
          player.qTargetX = dummy.x;
          player.qTargetY = dummy.y;
        }
        player.isQCharging = false;
      }
    });

    // 충돌 처리 (미끄러짐)
    function handleCollision() {
      const box = {
        minX: dummy.x - dummy.bodyWidth / 2,
        maxX: dummy.x + dummy.bodyWidth / 2,
        minY: dummy.y - dummy.headHeight,
        maxY: dummy.y + dummy.bodyHeight
      };

      const closestX = Math.max(box.minX, Math.min(player.x, box.maxX));
      const closestY = Math.max(box.minY, Math.min(player.y, box.maxY));

      let dx = player.x - closestX;
      let dy = player.y - closestY;
      let distance = Math.hypot(dx, dy);

      if (distance < player.radius) {
        if (distance === 0) {
          dx = -1;
          distance = 1;
        }

        const overlap = player.radius - distance;
        player.x += (dx / distance) * overlap;
        player.y += (dy / distance) * overlap;
      }
    }

    function update() {
      if (isMouseDown) {
        player.targetX = mouseX;
        player.targetY = mouseY;
      }

      // 1. Q 포물선 도약 이동
      if (player.isQJumping) {
        player.qTimeLeft--;
        const t = 1 - (player.qTimeLeft / player.qDuration); // 0 -> 1

        player.x = player.qStartX + (player.qTargetX - player.qStartX) * t;
        player.y = player.qStartY + (player.qTargetY - player.qStartY) * t;

        if (player.qTimeLeft <= 0) {
          player.isQJumping = false;
          if (!isMouseDown) {
            player.targetX = player.x;
            player.targetY = player.y;
          }
        }
      }
      // 2. W 직진 돌진 이동
      else if (player.isDashing) {
        player.x += player.dashDirX * player.dashSpeed;
        player.y += player.dashDirY * player.dashSpeed;

        player.dashTimeLeft--;
        if (player.dashTimeLeft <= 0) {
          player.isDashing = false;
          if (!isMouseDown) {
            player.targetX = player.x;
            player.targetY = player.y;
          }
        }
      } 
      // 3. 일반 클릭 이동
      else {
        const dx = player.targetX - player.x;
        const dy = player.targetY - player.y;
        const distance = Math.hypot(dx, dy);

        if (distance > player.speed) {
          player.x += (dx / distance) * player.speed;
          player.y += (dy / distance) * player.speed;
        } else {
          player.x = player.targetX;
          player.y = player.targetY;
        }
      }

      // 돌진 및 점프 상태가 아닐 때만 충돌 적용
      if (!player.isDashing && !player.isQJumping) {
        handleCollision();
      }
    }

    // 범위 표시용 원 그리기
    function drawRangeCircle(x, y, radius) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0, 191, 255, 0.18)'; // 투명도 높은 하늘색
      ctx.fill();
      ctx.strokeStyle = 'rgba(0, 191, 255, 0.5)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
    }

    // 화살표 그리기
    function drawArrow(fromX, fromY, toX, toY, color) {
      const headLength = 10;
      const dx = toX - fromX;
      const dy = toY - fromY;
      const angle = Math.atan2(dy, dx);

      ctx.save();
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 3;

      ctx.beginPath();
      ctx.moveTo(fromX, fromY);
      ctx.lineTo(toX, toY);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(toX, toY);
      ctx.lineTo(toX - headLength * Math.cos(angle - Math.PI / 6), toY - headLength * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(toX - headLength * Math.cos(angle + Math.PI / 6), toY - headLength * Math.sin(angle + Math.PI / 6));
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 더미 타겟팅 하이라이트 (Q 누르는 중 더미에 마우스 오버 시)
      if (player.isQCharging && isMouseOverDummy() && isDummyInQRange()) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(dummy.x, dummy.y + 7, 24, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 215, 0, 0.3)';
        ctx.fill();
        ctx.strokeStyle = '#FFD700';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
      }

      // 더미 그리기
      ctx.fillStyle = dummy.bodyColor;
      ctx.fillRect(dummy.x - dummy.bodyWidth / 2, dummy.y, dummy.bodyWidth, dummy.bodyHeight);

      ctx.fillStyle = dummy.headColor;
      ctx.fillRect(dummy.x - dummy.headWidth / 2, dummy.y - dummy.headHeight, dummy.headWidth, dummy.headHeight);

      // W 범위 & 화살표 표시
      if (player.isCharging) {
        const wDist = player.dashSpeed * player.dashDuration;
        drawRangeCircle(player.x, player.y, wDist);

        const dx = mouseX - player.x;
        const dy = mouseY - player.y;
        const distance = Math.hypot(dx, dy);

        if (distance > 0) {
          const targetArrowX = player.x + (dx / distance) * wDist;
          const targetArrowY = player.y + (dy / distance) * wDist;

          const now = Date.now();
          const isReady = (now - player.lastDashTime) >= player.cooldownTime;
          const arrowColor = isReady ? '#00FFCC' : '#FF4444';

          drawArrow(player.x, player.y, targetArrowX, targetArrowY, arrowColor);
        }
      }

      // Q 범위 표시 (대상이 없거나 Q 누르는 동안)
      if (player.isQCharging) {
        drawRangeCircle(player.x, player.y, player.qRange);
      }

      // 플레이어 위치 계산 (Q 포물선 점프 시 시각적 높이 적용)
      let renderY = player.y;
      if (player.isQJumping) {
        const t = 1 - (player.qTimeLeft / player.qDuration);
        const arcOffset = 4 * player.qArcMax * t * (1 - t); // 2D 상단 시점 높이 오프셋
        renderY -= arcOffset;
      }

      // 플레이어 그리기
      ctx.beginPath();
      ctx.arc(player.x, renderY, player.radius, 0, Math.PI * 2);
      ctx.fillStyle = player.color;
      ctx.fill();
      ctx.closePath();

      // UI
      const now = Date.now();
      const cooldownRemaining = Math.max(0, (player.cooldownTime - (now - player.lastDashTime)) / 1000);

      ctx.fillStyle = '#FFFFFF';
      ctx.font = '16px sans-serif';
      if (cooldownRemaining > 0) {
        ctx.fillText(`W 쿨타임: ${cooldownRemaining.toFixed(1)}초 | Q: 대상 클릭 도약`, 20, 35);
      } else {
        ctx.fillText('W: 돌진 준비 완료 | Q: 대상 클릭 도약', 20, 35);
      }
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
