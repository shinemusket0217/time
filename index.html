<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2D World Project</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #222222;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="world"></canvas>

  <script>
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let mouseX = canvas.width / 2;
    let mouseY = canvas.height / 2;

    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    // 1. 더미 (허수아비)
    const dummy = {
      x: canvas.width / 2 + 150,
      y: canvas.height / 2,
      bodyWidth: 20,
      bodyHeight: 30,
      headWidth: 20,
      headHeight: 16,
      bodyColor: '#FFFFE0',
      headColor: '#558B2F'
    };

    // 2. 플레이어 (핑크색 원)
    const player = {
      x: canvas.width / 2 - 150,
      y: canvas.height / 2,
      targetX: canvas.width / 2 - 150,
      targetY: canvas.height / 2,
      radius: 15,
      color: '#FF69B4',
      speed: 10 / 3,        // 기본 이동 속도
      
      // 돌진 시스템 속성
      isDashing: false,
      dashSpeed: 15,        // 돌진 속도 (기본 속도의 약 4.5배)
      dashDuration: 12,     // 돌진 지속 프레임 수
      dashTimeLeft: 0,      // 남은 돌진 프레임
      dashDirX: 0,          // 돌진 고정 방향 X
      dashDirY: 0           // 돌진 고정 방향 Y
    };

    // 마우스 클릭 시 목표 지점 변경
    window.addEventListener('click', (e) => {
      player.targetX = e.clientX;
      player.targetY = e.clientY;
    });

    // W키 누를 때 돌진 시작
    window.addEventListener('keydown', (e) => {
      if ((e.key === 'w' || e.key === 'W') && !player.isDashing) {
        const dx = mouseX - player.x;
        const dy = mouseY - player.y;
        const distance = Math.hypot(dx, dy);

        if (distance > 0) {
          player.isDashing = true;
          player.dashTimeLeft = player.dashDuration;
          // 눌렀을 때의 방향 벡터 고정
          player.dashDirX = dx / distance;
          player.dashDirY = dy / distance;
        }
      }
    });

    function update() {
      // 1. 돌진 중일 때
      if (player.isDashing) {
        player.x += player.dashDirX * player.dashSpeed;
        player.y += player.dashDirY * player.dashSpeed;
        
        player.dashTimeLeft--;
        if (player.dashTimeLeft <= 0) {
          player.isDashing = false; // 돌진 종료
        }
      } 
      // 2. 일반 클릭 이동 중일 때
      else {
        const dx = player.targetX - player.x;
        const dy = player.targetY - player.y;
        const distance = Math.hypot(dx, dy);

        if (distance > player.speed) {
          player.x += (dx / distance) * player.speed;
          player.y += (dy / distance) * player.speed;
        } else {
          player.x = player.targetX;
          player.y = player.targetY;
        }
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 더미 그리기
      ctx.fillStyle = dummy.bodyColor;
      ctx.fillRect(dummy.x - dummy.bodyWidth / 2, dummy.y, dummy.bodyWidth, dummy.bodyHeight);

      ctx.fillStyle = dummy.headColor;
      ctx.fillRect(dummy.x - dummy.headWidth / 2, dummy.y - dummy.headHeight, dummy.headWidth, dummy.headHeight);

      // 플레이어 그리기
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fillStyle = player.color;
      ctx.fill();
      ctx.closePath();
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
