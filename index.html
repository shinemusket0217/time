<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리반 수행평가 시간표</title>
  <style>
    * { box-sizing: border-box; font-family: 'Pretendard', sans-serif; }
    body { background-color: #f5f6fa; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    h1 { color: #333; margin-bottom: 20px; }

    /* 주간 시간표 그리드 */
    .timetable {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 900px;
    }
    .day-column {
      background: #ffffff;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .day-header { text-align: center; font-weight: bold; padding-bottom: 10px; border-bottom: 2px solid #eee; margin-bottom: 10px; }

    /* 수행평가 카드 */
    .eval-card {
      background: #e3f2fd;
      border-left: 4px solid #2196f3;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .eval-card:hover { transform: translateY(-2px); background: #bbdefb; }
    .eval-card.urgent { background: #ffebee; border-color: #f44336; } /* 제출 임박 */
    .subject { font-weight: bold; font-size: 0.9em; color: #333; }
    .title { font-size: 0.85em; color: #555; margin-top: 4px; }

    /* 상세 모달 (팝업창) */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); display: none;
      justify-content: center; align-items: center;
    }
    .modal-content {
      background: white; padding: 24px; border-radius: 12px;
      width: 90%; max-width: 400px; position: relative;
    }
    .close-btn {
      position: absolute; top: 12px; right: 16px; font-size: 20px; cursor: pointer; border: none; background: none;
    }
    .modal-title { font-size: 1.2em; font-weight: bold; margin-bottom: 12px; color: #2196f3; }
    .modal-info { font-size: 0.95em; line-height: 1.6; color: #444; }
  </style>
</head>
<body>

  <h1>📅 이번 주 수행평가 일정</h1>

  <div class="timetable">
    <div class="day-column">
      <div class="day-header">월</div>
      <div class="eval-card urgent" onclick="openModal('국어', '8월 17일(월) 3교시', '서평 작성하기 (원고지 1,000자)', '원고지, 필기구, 읽은 책')">
        <div class="subject">국어</div>
        <div class="title">서평 작성하기</div>
      </div>
    </div>

    <div class="day-column">
      <div class="day-header">화</div>
    </div>

    <div class="day-column">
      <div class="day-header">수</div>
      <div class="eval-card" onclick="openModal('수학', '8월 19일(수) 5교시', '이차함수 문제 풀이 및 발표', '교과서, 연습장')">
        <div class="subject">수학</div>
        <div class="title">함수 문제 발표</div>
      </div>
    </div>

    <div class="day-column">
      <div class="day-header">목</div>
    </div>

    <div class="day-column">
      <div class="day-header">금</div>
      <div class="eval-card" onclick="openModal('영어', '8월 21일(금) 2교시', '영시 암송 및 해석 제출', '유인물')">
        <div class="subject">영어</div>
        <div class="title">영시 암송 평가</div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <div class="modal-title" id="m-subject">과목명</div>
      <div class="modal-info">
        <p><strong>일시:</strong> <span id="m-date"></span></p>
        <p><strong>수행 내용:</strong> <span id="m-detail"></span></p>
        <p><strong>준비물:</strong> <span id="m-prep"></span></p>
      </div>
    </div>
  </div>

  <script>
    function openModal(subject, date, detail, prep) {
      document.getElementById('m-subject').innerText = subject;
      document.getElementById('m-date').innerText = date;
      document.getElementById('m-detail').innerText = detail;
      document.getElementById('m-prep').innerText = prep;
      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }
  </script>
</body>
</html>
