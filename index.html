<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>지뢰찾기</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #f4f4f9; padding-top: 30px; }
    #board { display: grid; grid-template-columns: repeat(10, 35px); gap: 2px; margin-top: 15px; background: #bbb; padding: 2px; border-radius: 4px; }
    .cell { width: 35px; height: 35px; background: #e0e0e0; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; user-select: none; font-size: 1.1rem; }
    .cell.revealed { background: #ffffff; cursor: default; }
    .cell.mine { background: #e53935; }
    .cell.flagged { background: #fff59d; }
    #status { margin-top: 15px; font-size: 1.2rem; font-weight: bold; height: 1.5rem; }
    button { padding: 8px 16px; font-size: 1rem; cursor: pointer; border: none; background: #1e88e5; color: white; border-radius: 4px; }
    button:hover { background: #1565c0; }
  </style>
</head>
<body>
  <h1>💣 지뢰찾기</h1>
  <button onclick="initGame()">새 게임</button>
  <div id="board"></div>
  <div id="status"></div>

  <script>
    const ROWS = 10, COLS = 10, MINES = 10;
    let board = [], revealedCount = 0, gameOver = false;

    function initGame() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      document.getElementById('status').innerText = '';
      board = []; revealedCount = 0; gameOver = false;

      for (let r = 0; r < ROWS; r++) {
        board[r] = [];
        for (let c = 0; c < COLS; c++) {
          board[r][c] = { mine: false, revealed: false, flagged: false, count: 0 };
        }
      }

      let placed = 0;
      while (placed < MINES) {
        let r = Math.floor(Math.random() * ROWS);
        let c = Math.floor(Math.random() * COLS);
        if (!board[r][c].mine) {
          board[r][c].mine = true;
          placed++;
        }
      }

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (board[r][c].mine) continue;
          let count = 0;
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              let nr = r + dr, nc = c + dc;
              if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc].mine) count++;
            }
          }
          board[r][c].count = count;
        }
      }

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.addEventListener('click', () => reveal(r, c));
          cell.addEventListener('contextmenu', (e) => { e.preventDefault(); flag(r, c); });
          boardEl.appendChild(cell);
        }
      }
    }

    function reveal(r, c) {
      if (gameOver || board[r][c].revealed || board[r][c].flagged) return;
      board[r][c].revealed = true;
      const cellEl = getCellEl(r, c);
      cellEl.classList.add('revealed');

      if (board[r][c].mine) {
        cellEl.classList.add('mine');
        cellEl.innerText = '💣';
        document.getElementById('status').innerText = '💥 게임 오버!';
        gameOver = true;
        revealAllMines();
        return;
      }

      revealedCount++;
      if (board[r][c].count > 0) {
        cellEl.innerText = board[r][c].count;
      } else {
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            let nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) reveal(nr, nc);
          }
        }
      }

      if (revealedCount === ROWS * COLS - MINES) {
        document.getElementById('status').innerText = '🎉 승리했습니다!';
        gameOver = true;
      }
    }

    function flag(r, c) {
      if (gameOver || board[r][c].revealed) return;
      board[r][c].flagged = !board[r][c].flagged;
      const cellEl = getCellEl(r, c);
      cellEl.classList.toggle('flagged');
      cellEl.innerText = board[r][c].flagged ? '🚩' : '';
    }

    function getCellEl(r, c) {
      return document.getElementById('board').children[r * COLS + c];
    }

    function revealAllMines() {
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (board[r][c].mine) {
            const cellEl = getCellEl(r, c);
            cellEl.classList.add('mine');
            cellEl.innerText = '💣';
          }
        }
      }
    }

    initGame();
  </script>
</body>
</html>
