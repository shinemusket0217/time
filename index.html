<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2D World Project</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #222222;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="world"></canvas>

  <script>
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let mouseX = canvas.width / 2;
    let mouseY = canvas.height / 2;
    let isMouseDown = false;
    let isInfiniteCooldown = false;

    const resetBtn = { x: 20, y: 55, width: 40, height: 40 };

    const aoeEffects = [];
    const knockbackRects = [];

    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      if (isMouseDown && !player.isTargetingDummy && !player.isAutoRunning && !player.isECharging) {
        player.targetX = mouseX;
        player.targetY = mouseY;
      }
    });

    window.addEventListener('mousedown', (e) => {
      if (e.clientX >= resetBtn.x && e.clientX <= resetBtn.x + resetBtn.width &&
          e.clientY >= resetBtn.y && e.clientY <= resetBtn.y + resetBtn.height) {
        isInfiniteCooldown = !isInfiniteCooldown;
        return;
      }

      if (player.isAutoRunning || player.isECharging) return;

      isMouseDown = true;

      if (isMouseOverDummy()) {
        player.isTargetingDummy = true;
      } else {
        player.isTargetingDummy = false;
        player.targetX = e.clientX;
        player.targetY = e.clientY;
      }
    });

    window.addEventListener('mouseup', () => {
      isMouseDown = false;
    });

    // 1. 더미 (원형 디자인)
    const dummy = {
      x: canvas.width / 2 + 150,
      y: canvas.height / 2,
      radius: 14,             // 원형 더미 반지름
      bodyColor: '#FFFFE0',   // 아이보리색
      headColor: '#558B2F',   // 짙은 연두색
      vx: 0,
      vy: 0
    };

    // 2. 플레이어 (핑크색 원)
    const player = {
      x: canvas.width / 2 - 150,
      y: canvas.height / 2,
      targetX: canvas.width / 2 - 150,
      targetY: canvas.height / 2,
      radius: 15,
      color: '#FF69B4',
      speed: 10 / 3,

      // W 돌진 & 광폭 자동 추적
      isCharging: false,
      isDashing: false,
      dashSpeed: 10.5,
      dashDuration: 6,
      dashTimeLeft: 0,
      dashDirX: 0,
      dashDirY: 0,
      cooldownTime: 13000,
      lastDashTime: 0,

      // 광폭 자동 추적 및 W 평타 강화 시스템
      isAutoRunning: false,
      autoRunEndTime: 0,
      wEmpowered: false,       // 평타 강화 켜짐 여부
      wEmpoweredUsed: false,   // 광폭 동안 1회 사용 제한

      // Q 스킬
      isQCharging: false,
      isQJumping: false,
      qRange: 112,
      qDuration: 18,
      qTimeLeft: 0,
      qStartX: 0,
      qStartY: 0,
      qTargetX: 0,
      qTargetY: 0,
      qArcMax: 30,
      currentQArcMax: 30,
      qCooldownTime: 10000,
      lastQTime: 0,

      // E 스킬 (차징 방향 고정)
      isECharging: false,
      eChargeStart: 0,
      eAngle: 0,               // 차징 시작 시 마우스 방향 고정
      eMaxChargeTime: 900,
      eMinRange: 20,
      eMaxRange: 90,
      eWidth: 65,
      eCooldownTime: 8000,
      lastETime: 0,

      // 평타 & 타겟팅
      isTargetingDummy: false,
      attackRange: 63 * (2 / 3),
      defaultAttackInterval: 1500,
      autoAttackInterval: 1000,
      isInAttackRange: false,
      lastAttackTime: 0,
      hasSpawnedAoEThisCycle: false,
      instantAttackScale: 0.075
    };

    let playerScale = 1.0;
    let dummyScale = 1.0;

    // 더미 마우스 오버 판정 (원형)
    function isMouseOverDummy() {
      const dist = Math.hypot(mouseX - dummy.x, mouseY - dummy.y);
      return dist <= dummy.radius + 8;
    }

    function isDummyInQRange() {
      const dist = Math.hypot(dummy.x - player.x, dummy.y - player.y);
      return dist <= player.qRange;
    }

    window.addEventListener('keydown', (e) => {
      if ((e.key === 'w' || e.key === 'W') && !e.repeat && !player.isECharging) {
        // 광폭 추적 중 W 입력 시 1회에 한해 '평타 강화' 버프 켜기 (평타 딜레이 캔슬)
        if (player.isAutoRunning && !player.isDashing && !player.isQJumping) {
          if (!player.wEmpoweredUsed) {
            player.wEmpowered = true;
            player.wEmpoweredUsed = true;
            player.lastAttackTime = Date.now() - player.autoAttackInterval; // 즉시 평타 발동 캔슬
          }
          return;
        }

        if (!player.isAutoRunning) {
          player.isCharging = true;
        }
      }

      if ((e.key === 'q' || e.key === 'Q') && !e.repeat && !player.isECharging) {
        player.isQCharging = true;
      }

      // E 스킬 누를 때의 마우스 방향을 고정(eAngle)
      if ((e.key === 'e' || e.key === 'E') && !e.repeat && !player.isECharging) {
        const now = Date.now();
        const eTimePassed = now - player.lastETime;
        if (isInfiniteCooldown || eTimePassed >= player.eCooldownTime) {
          player.isAutoRunning = false;
          player.isTargetingDummy = false;

          player.isECharging = true;
          player.eChargeStart = now;
          player.eAngle = Math.atan2(mouseY - player.y, mouseX - player.x); // 차징 방향 고정

          player.targetX = player.x;
          player.targetY = player.y;
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      const now = Date.now();

      // W 돌진
      if (e.key === 'w' || e.key === 'W') {
        if (!player.isAutoRunning) {
          const timePassed = now - player.lastDashTime;
          const canUseW = isInfiniteCooldown || (timePassed >= player.cooldownTime);

          if (player.isCharging && canUseW && !player.isDashing && !player.isQJumping && !player.isECharging) {
            const dx = mouseX - player.x;
            const dy = mouseY - player.y;
            const distance = Math.hypot(dx, dy);

            if (distance > 0) {
              player.isDashing = true;
              player.dashTimeLeft = player.dashDuration;
              player.dashDirX = dx / distance;
              player.dashDirY = dy / distance;
              player.lastDashTime = now;
              player.isTargetingDummy = false;
            }
          }
          player.isCharging = false;
        }
      }

      // Q 도약
      if (e.key === 'q' || e.key === 'Q') {
        const qTimePassed = now - player.lastQTime;
        const canUseQ = isInfiniteCooldown || (qTimePassed >= player.qCooldownTime);

        if (player.isQCharging && isMouseOverDummy() && isDummyInQRange() && canUseQ && !player.isDashing && !player.isQJumping && !player.isECharging) {
          player.isQJumping = true;
          player.qTimeLeft = player.qDuration;
          player.qStartX = player.x;
          player.qStartY = player.y;
          player.qTargetX = dummy.x;
          player.qTargetY = dummy.y;

          const jumpDistance = Math.hypot(dummy.x - player.x, dummy.y - player.y);
          player.currentQArcMax = player.qArcMax * Math.min(1.0, jumpDistance / player.qRange);

          player.lastQTime = now;
        }
        player.isQCharging = false;
      }

      // E 스킬 (고정된 eAngle 방향으로 밀쳐내기 발동)
      if (e.key === 'e' || e.key === 'E') {
        if (player.isECharging) {
          const chargedTime = now - player.eChargeStart;
          const isFullCharged = chargedTime >= player.eMaxChargeTime;

          if (isFullCharged) {
            const currentLength = player.eMaxRange;
            const angle = player.eAngle; // 차징 시작 시 고정된 방향 사용

            const dummyDx = dummy.x - player.x;
            const dummyDy = dummy.y - player.y;
            const localX = dummyDx * Math.cos(-angle) - dummyDy * Math.sin(-angle);
            const localY = dummyDx * Math.sin(-angle) + dummyDy * Math.cos(-angle);

            if (localX >= 0 && localX <= currentLength && Math.abs(localY) <= player.eWidth / 2) {
              const pushForce = 22;
              dummy.vx = Math.cos(angle) * pushForce;
              dummy.vy = Math.sin(angle) * pushForce;
            }

            knockbackRects.push({
              x: player.x,
              y: player.y,
              angle: angle,
              width: player.eWidth,
              currentLength: 0,
              maxLength: currentLength,
              speed: currentLength / 4,
              alpha: 1.0
            });

            player.lastETime = now;
          }

          player.isECharging = false;
        }
      }
    });

    // 원-원 충돌 처리
    function handleCollision() {
      const dx = player.x - dummy.x;
      const dy = player.y - dummy.y;
      const distance = Math.hypot(dx, dy);
      const minDistance = player.radius + dummy.radius;

      if (distance < minDistance) {
        let nx = dx / distance;
        let ny = dy / distance;
        if (distance === 0) {
          nx = -1;
          ny = 0;
        }
        const overlap = minDistance - distance;
        player.x += nx * overlap;
        player.y += ny * overlap;
      }
    }

    function update() {
      const now = Date.now();

      if (isInfiniteCooldown) {
        player.lastDashTime = 0;
        player.lastQTime = 0;
        player.lastETime = 0;
      }

      dummy.x += dummy.vx;
      dummy.y += dummy.vy;
      dummy.vx *= 0.86;
      dummy.vy *= 0.86;

      if (player.isAutoRunning) {
        if (now > player.autoRunEndTime) {
          player.isAutoRunning = false;
          player.isTargetingDummy = false;
          player.wEmpowered = false;
        } else {
          player.isTargetingDummy = true;
        }
      }

      const currentSpeed = player.isAutoRunning ? player.speed * 1.2 : player.speed;

      if (player.isECharging) {
        player.targetX = player.x;
        player.targetY = player.y;
        player.isInAttackRange = false;
      } else if (player.isTargetingDummy || player.isAutoRunning) {
        const dx = dummy.x - player.x;
        const dy = dummy.y - player.y;
        const distToDummy = Math.hypot(dx, dy);

        if (distToDummy > player.attackRange) {
          player.targetX = dummy.x - (dx / distToDummy) * player.attackRange;
          player.targetY = dummy.y - (dy / distToDummy) * player.attackRange;
          player.isInAttackRange = false;
        } else {
          player.targetX = player.x;
          player.targetY = player.y;
          player.isInAttackRange = true;
        }
      } else {
        player.isInAttackRange = false;
      }

      const currentAttackInterval = player.isAutoRunning ? player.autoAttackInterval : player.defaultAttackInterval;

      // 평타 공격 시점 처리
      if (player.isInAttackRange && !player.isDashing && !player.isQJumping && !player.isECharging) {
        if (!player.lastAttackTime) player.lastAttackTime = now;

        const cycle = (now - player.lastAttackTime) % currentAttackInterval;

        // 실제 평타 타격 순간
        if (player.isAutoRunning && cycle < 50 && !player.hasSpawnedAoEThisCycle) {
          const maxR = 45;
          const isEmpowered = player.wEmpowered;

          aoeEffects.push({
            x: player.x,
            y: player.y,
            radius: maxR * 0.8,
            maxRadius: maxR,
            alpha: isEmpowered ? 0.9 : 0.7,
            isRed: isEmpowered // 평타 강회가 활성화된 상태면 붉은색 이펙트 발동
          });

          if (isEmpowered) {
            player.instantAttackScale = 0.25; // 강화 평타 25% 크기 모션
            player.wEmpowered = false;          // 강화 평타 소모
          } else {
            player.instantAttackScale = 0.075;
          }

          player.hasSpawnedAoEThisCycle = true;
        }

        if (cycle >= 50) {
          player.hasSpawnedAoEThisCycle = false;
        }

        const animDuration = currentAttackInterval * 0.25;
        if (cycle < animDuration) {
          const progress = cycle / animDuration;
          const pulse = Math.sin(progress * Math.PI);
          playerScale = 1 + pulse * player.instantAttackScale;
          dummyScale = 1 - pulse * player.instantAttackScale;
        } else {
          playerScale = 1.0;
          dummyScale = 1.0;
          player.instantAttackScale = 0.075;
        }
      } else {
        player.lastAttackTime = 0;
        player.hasSpawnedAoEThisCycle = false;
        playerScale = 1.0;
        dummyScale = 1.0;
        player.instantAttackScale = 0.075;
      }

      // 바닥 원형 이펙트
      for (let i = aoeEffects.length - 1; i >= 0; i--) {
        const fx = aoeEffects[i];
        fx.radius += 2.5;
        fx.alpha -= 0.1;
        if (fx.alpha <= 0 || fx.radius >= fx.maxRadius) {
          aoeEffects.splice(i, 1);
        }
      }

      for (let i = knockbackRects.length - 1; i >= 0; i--) {
        const rect = knockbackRects[i];
        rect.currentLength += rect.speed;
        if (rect.currentLength >= rect.maxLength) {
          rect.currentLength = rect.maxLength;
          rect.alpha -= 0.15;
        }
        if (rect.alpha <= 0) {
          knockbackRects.splice(i, 1);
        }
      }

      if (player.isQJumping) {
        player.qTimeLeft--;
        const t = 1 - (player.qTimeLeft / player.qDuration);

        player.x = player.qStartX + (player.qTargetX - player.qStartX) * t;
        player.y = player.qStartY + (player.qTargetY - player.qStartY) * t;

        if (player.qTimeLeft <= 0) {
          player.isQJumping = false;
          if (!isMouseDown && !player.isAutoRunning) {
            player.targetX = player.x;
            player.targetY = player.y;
          }
        }
      } else if (player.isDashing) {
        player.x += player.dashDirX * player.dashSpeed;
        player.y += player.dashDirY * player.dashSpeed;

        player.dashTimeLeft--;
        if (player.dashTimeLeft <= 0) {
          player.isDashing = false;
          player.isAutoRunning = true;
          player.autoRunEndTime = Date.now() + 8000;
          player.wEmpowered = false;
          player.wEmpoweredUsed = false; // 광폭 진입 시 강화 평타 기회 초기화
        }
      } else if (!player.isECharging) {
        const dx = player.targetX - player.x;
        const dy = player.targetY - player.y;
        const distance = Math.hypot(dx, dy);

        if (distance > currentSpeed) {
          player.x += (dx / distance) * currentSpeed;
          player.y += (dy / distance) * currentSpeed;
        } else {
          player.x = player.targetX;
          player.y = player.targetY;
        }
      }

      if (!player.isDashing && !player.isQJumping) {
        handleCollision();
      }
    }

    function drawRangeCircle(x, y, radius, color = 'rgba(0, 191, 255, 0.18)', strokeColor = 'rgba(0, 191, 255, 0.5)') {
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = strokeColor;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
    }

    function drawArrow(fromX, fromY, toX, toY, color) {
      const headLength = 10;
      const dx = toX - fromX;
      const dy = toY - fromY;
      const angle = Math.atan2(dy, dx);

      ctx.save();
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 3;

      ctx.beginPath();
      ctx.moveTo(fromX, fromY);
      ctx.lineTo(toX, toY);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(toX, toY);
      ctx.lineTo(toX - headLength * Math.cos(angle - Math.PI / 6), toY - headLength * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(toX - headLength * Math.cos(angle + Math.PI / 6), toY - headLength * Math.sin(angle + Math.PI / 6));
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function drawHourglassButton() {
      ctx.save();
      ctx.fillStyle = isInfiniteCooldown ? 'rgba(255, 215, 0, 0.3)' : 'rgba(255, 255, 255, 0.15)';
      ctx.strokeStyle = isInfiniteCooldown ? '#FFD700' : 'rgba(255, 255, 255, 0.4)';
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.rect(resetBtn.x, resetBtn.y, resetBtn.width, resetBtn.height);
      ctx.fill();
      ctx.stroke();

      const cx = resetBtn.x + resetBtn.width / 2;
      const cy = resetBtn.y + resetBtn.height / 2;
      const size = 8;

      ctx.fillStyle = isInfiniteCooldown ? '#FFD700' : 'rgba(255, 255, 255, 0.7)';
      ctx.beginPath();
      ctx.moveTo(cx - size, cy - size);
      ctx.lineTo(cx + size, cy - size);
      ctx.lineTo(cx, cy);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(cx - size, cy + size);
      ctx.lineTo(cx + size, cy + size);
      ctx.lineTo(cx, cy);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = isInfiniteCooldown ? '#FFFFFF' : 'rgba(255, 255, 255, 0.9)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx - size, cy - size);
      ctx.lineTo(cx + size, cy - size);
      ctx.moveTo(cx - size, cy + size);
      ctx.lineTo(cx + size, cy + size);
      ctx.stroke();

      ctx.restore();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const now = Date.now();
      const qTimePassed = now - player.lastQTime;
      const isQReady = isInfiniteCooldown || (qTimePassed >= player.qCooldownTime);

      for (const fx of aoeEffects) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(fx.x, fx.y, fx.radius, 0, Math.PI * 2);

        if (fx.isRed) {
          ctx.fillStyle = `rgba(255, 30, 30, ${fx.alpha * 0.45})`;
          ctx.strokeStyle = `rgba(255, 0, 0, ${fx.alpha})`;
        } else {
          ctx.fillStyle = `rgba(255, 0, 255, ${fx.alpha * 0.35})`;
          ctx.strokeStyle = `rgba(255, 20, 147, ${fx.alpha})`;
        }

        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.restore();
      }

      for (const rect of knockbackRects) {
        ctx.save();
        ctx.translate(rect.x, rect.y);
        ctx.rotate(rect.angle);
        ctx.fillStyle = `rgba(255, 20, 147, ${rect.alpha * 0.35})`;
        ctx.strokeStyle = `rgba(255, 20, 147, ${rect.alpha})`;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.rect(0, -rect.width / 2, rect.currentLength, rect.width);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      if (player.isQCharging && isMouseOverDummy() && isDummyInQRange()) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(dummy.x, dummy.y, 22, 0, Math.PI * 2);
        ctx.fillStyle = isQReady ? 'rgba(255, 215, 0, 0.3)' : 'rgba(255, 68, 68, 0.3)';
        ctx.fill();
        ctx.strokeStyle = isQReady ? '#FFD700' : '#FF4444';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
      }

      // 원형 더미 그리기 (아이보리 몸통 + 상단 어두운 연두색 모자 포인트)
      ctx.save();
      ctx.translate(dummy.x, dummy.y);
      ctx.scale(dummyScale, dummyScale);

      ctx.beginPath();
      ctx.arc(0, 0, dummy.radius, 0, Math.PI * 2);
      ctx.fillStyle = dummy.bodyColor;
      ctx.fill();

      // 상단 어두운 연두색 헤드
      ctx.beginPath();
      ctx.arc(0, -3, dummy.radius * 0.65, Math.PI, Math.PI * 2);
      ctx.fillStyle = dummy.headColor;
      ctx.fill();

      ctx.restore();

      if (player.isCharging) {
        const wDist = player.dashSpeed * player.dashDuration;
        drawRangeCircle(player.x, player.y, wDist);

        const dx = mouseX - player.x;
        const dy = mouseY - player.y;
        const distance = Math.hypot(dx, dy);

        if (distance > 0) {
          const targetArrowX = player.x + (dx / distance) * wDist;
          const targetArrowY = player.y + (dy / distance) * wDist;

          const isReady = isInfiniteCooldown || ((now - player.lastDashTime) >= player.cooldownTime);
          const arrowColor = isReady ? '#00FFCC' : '#FF4444';

          drawArrow(player.x, player.y, targetArrowX, targetArrowY, arrowColor);
        }
      }

      if (player.isQCharging) {
        drawRangeCircle(player.x, player.y, player.qRange);
      }

      // E 차징 영역 표시 (고정된 eAngle 사용)
      if (player.isECharging) {
        const chargedTime = Math.min(player.eMaxChargeTime, now - player.eChargeStart);
        const ratio = chargedTime / player.eMaxChargeTime;
        const currentLength = player.eMinRange + (player.eMaxRange - player.eMinRange) * ratio;

        const isFullCharged = ratio >= 1.0;

        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(player.eAngle); // 고정 방향으로 그리기

        ctx.fillStyle = isFullCharged ? 'rgba(255, 20, 147, 0.35)' : 'rgba(0, 191, 255, 0.18)';
        ctx.strokeStyle = isFullCharged ? '#FF1493' : 'rgba(0, 191, 255, 0.6)';
        ctx.lineWidth = isFullCharged ? 2.5 : 1.5;

        ctx.beginPath();
        ctx.rect(0, -player.eWidth / 2, currentLength, player.eWidth);
        ctx.fill();
        ctx.stroke();

        ctx.restore();
      }

      let renderY = player.y;
      if (player.isQJumping) {
        const t = 1 - (player.qTimeLeft / player.qDuration);
        const arcOffset = 4 * player.currentQArcMax * t * (1 - t);
        renderY -= arcOffset;
      }

      ctx.beginPath();
      ctx.arc(player.x, renderY, player.radius * playerScale, 0, Math.PI * 2);
      ctx.fillStyle = player.color;
      ctx.fill();
      if (player.isAutoRunning) {
        ctx.strokeStyle = player.wEmpowered ? '#FF0000' : '#FF1493'; // 강화 상태 시 붉은 테두리 강조
        ctx.lineWidth = player.wEmpowered ? 4 : 3;
        ctx.stroke();
      }
      ctx.closePath();

      drawHourglassButton();

      const wCooldownRemaining = Math.max(0, (player.cooldownTime - (now - player.lastDashTime)) / 1000);
      const qCooldownRemaining = Math.max(0, (player.qCooldownTime - (now - player.lastQTime)) / 1000);
      const eCooldownRemaining = Math.max(0, (player.eCooldownTime - (now - player.lastETime)) / 1000);

      ctx.fillStyle = '#FFFFFF';
      ctx.font = '14px sans-serif';

      const wText = isInfiniteCooldown ? 'W:무제한' : (wCooldownRemaining > 0 ? `W:${wCooldownRemaining.toFixed(1)}초` : 'W:가능');
      const qText = isInfiniteCooldown ? 'Q:무제한' : (qCooldownRemaining > 0 ? `Q:${qCooldownRemaining.toFixed(1)}초` : 'Q:가능');
      const eText = isInfiniteCooldown ? 'E:무제한' : (eCooldownRemaining > 0 ? `E:${eCooldownRemaining.toFixed(1)}초` : 'E:가능');
      const empoweredText = player.wEmpowered ? ' [평타 강화 준비됨]' : '';
      const statusText = player.isAutoRunning ? ` | [광폭 추적 중: ${((player.autoRunEndTime - now)/1000).toFixed(1)}초${empoweredText}]` : '';

      ctx.fillText(`${wText} | ${qText} | ${eText}${statusText}`, 20, 32);
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
  </script>
</body>
</html>
