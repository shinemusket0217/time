<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2D World Project</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #222222;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="world"></canvas>

  <script>
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 1. 더미 (허수아비)
    const dummy = {
      x: canvas.width / 2 + 150,
      y: canvas.height / 2,
      bodyWidth: 20,
      bodyHeight: 30,
      headWidth: 20,       // 몸통 너비와 동일하게 수정
      headHeight: 16,
      bodyColor: '#FFFFE0', // 아이보리색
      headColor: '#558B2F'  // 짙은 연두색
    };

    // 2. 플레이어 (핑크색 원)
    const player = {
      x: canvas.width / 2 - 150,
      y: canvas.height / 2,
      targetX: canvas.width / 2 - 150,
      targetY: canvas.height / 2,
      radius: 15,
      color: '#FF69B4',
      speed: 5 / 3         // 속도 1/3로 축소 (~1.67)
    };

    window.addEventListener('click', (e) => {
      player.targetX = e.clientX;
      player.targetY = e.clientY;
    });

    function update() {
      const dx = player.targetX - player.x;
      const dy = player.targetY - player.y;
      const distance = Math.hypot(dx, dy);

      if (distance > player.speed) {
        player.x += (dx / distance) * player.speed;
        player.y += (dy / distance) * player.speed;
      } else {
        player.x = player.targetX;
        player.y = player.targetY;
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 더미 그리기
      ctx.fillStyle = dummy.bodyColor;
      ctx.fillRect(dummy.x - dummy.bodyWidth / 2, dummy.y, dummy.bodyWidth, dummy.bodyHeight);

      ctx.fillStyle = dummy.headColor;
      ctx.fillRect(dummy.x - dummy.headWidth / 2, dummy.y - dummy.headHeight, dummy.headWidth, dummy.headHeight);

      // 플레이어 그리기
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fillStyle = player.color;
      ctx.fill();
      ctx.closePath();
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
    loop();
  </script>
</body>
</html>
